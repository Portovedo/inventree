#This file is used to package the LandedCostCapacity plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.1
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-landed-cost-capacity"
description = "Landed cost allocation of purchase order fees, multi-level build capacity and production planning for InvenTree"
dynamic = ["version"]
authors = [
    { name = "WADA Solutions",email = "inventree@wada.solutions" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin", "landed cost", "build capacity", "bom"]
requires-python = ">=3.11"
dependencies = [
    # Enter your plugin library dependencies here
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]
[project.urls]
Homepage = "https://github.com/Portovedo/inventree"

[project.entry-points."inventree_plugins"]
LandedCostCapacity = "landed_cost_capacity.core:LandedCostCapacity"

[tool.setuptools.packages.find]
where = [""]
include = ["landed_cost_capacity*"]

[tool.setuptools.dynamic]
version = {attr = "landed_cost_capacity.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["landed_cost_capacity"]

[tool.ruff.lint]

ignore = [
    "I001",
    "PIE790",
    "RUF012"
]
